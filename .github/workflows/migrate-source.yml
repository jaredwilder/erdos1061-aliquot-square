name: One-shot source migration

on:
  push:
    paths:
      - '.github/workflows/migrate-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact #1061 sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jaredwilder/unpublished-math-papers.git /tmp/papers
          git clone --depth 1 https://github.com/jaredwilder/erdos-ore-findings.git /tmp/ore
          mkdir -p sigma-family rays ore-findings
          cp -R /tmp/papers/erdos1061-aliquot-square/. sigma-family/
          cp -R /tmp/papers/erdos1061-aliquot-square-rays/. rays/
          shopt -s nullglob
          for f in /tmp/ore/ERDOS-1061-*; do cp "$f" ore-findings/; done
          rm .github/workflows/migrate-source.yml
          git config user.name "Jared Wilder release migration"
          git config user.email "jared@jaredwilder.com"
          git add -A
          git commit -m "Migrate exact Erdős 1061 public source package"
          git push
